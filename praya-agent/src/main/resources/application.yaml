server:
  port: 8080
  forward-headers-strategy: framework
spring:
  application:
    name: praya-agent
  threads:
    virtual:
      enabled: true
  # Spring AI Configuration
  ai:
    chat:
      client:
        enabled: true
    openai:
      api-key: ${CHAT_KEY}
      base-url: ${CHAT_BASE_URL}
      chat:
        model: ${CHAT_MODEL}
        temperature: 0.2
        max-completion-tokens: 2048
      timeout: 120s
    # SafeGuard Configuration
    advisor:
      safeguard:
        blocked-words:
          - env
praya:
  portfolio:
    url: ${PORTFOLIO_URL}
  github:
    username: ${GITHUB_USERNAME}
    api-url: ${GITHUB_API_URL}
  linkedin:
    url: ${LINKEDIN_URL}
  rate-limiter:
    api-delay-ms: ${API_DELAY_MS:50}
  ratelimit:
    enabled: true
  ai:
    guardrail:
      enabled: true
      strict-mode: true
      blocked-words:
        - env
        - system prompt
        - drop table
        - ignore previous instructions
        - bypass restrictions
      input-patterns:
        - "(?i).*ignore\\s+(all\\s+)?previous\\s+(instructions|prompts|rules).*"
        - "(?i).*disregard\\s+all\\s+(prior|previous)\\s+(instructions|rules).*"
        - "(?i).*you\\s+are\\s+now\\s+in\\s+(dan|developer|jailbreak|unrestricted)\\s+mode.*"
        - "(?i).*(reveal|show|tell|print|dump|output|repeat|display).*(system\\s+prompt|developer\\s+instructions?|system\\s+rules?|internal\\s+instructions?|system\\s+directive|hidden\\s+rules?).*"
        - "(?i).*what\\s+are\\s+your\\s+(rules|instructions|prompts|guidelines|constraints|directives).*"
        - "(?i).*repeat\\s+(everything|the\\s+text)\\s+(above|prior).*"
      output-patterns:
        - "(?i)(api[_-]?key|access[_-]?token|secret[_-]?key)\\s*[:=]\\s*['\"]?[a-zA-Z0-9_\\-]{16,}['\"]?"
        - "ey[A-Za-z0-9_-]{10,}\\.ey[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
        - "(?i).*jdbc:[a-zA-Z0-9]+://.*password=.*"
        - "(?i).*(strict\\s+anti-hallucination|two-tier\\s+progressive\\s+tool\\s+catalog|progressive\\s+disclosure\\s+rules|system\\s+prompt\\s*:|internal\\s+rules\\s*:|tool\\s+calling\\s+chat\\s+options|under\\s+no\\s+circumstances\\s+should\\s+you\\s+reveal).*"
      input-violation-message: "Input security validation failed: Request violates safety policies."
      output-violation-message: "Output security validation failed: Response withheld due to safety policies."
# ACTUATOR AND HEALTH CHECKS
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true
      readinessstate:
        enabled: true
      show-details: never
# APPLICATION INFORMATION
info:
  app:
    name: Praya-Agent
    description: "Praya AI Pranit Personal AI Assistant."
    version: 1.0.0
# LOGGING CONFIGURATION
logging:
  file:
    name: ${LOG_PATH:logs/praya.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.pranit.praya: ${LOG_LEVEL:INFO}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:logs/praya.log}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
# SERVER
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 8KB
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html,text/xml,text/css,application/javascript
    min-response-size: 1KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
# SPRING CORE
spring:
  application:
    name: praya-agent
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  jackson:
    default-property-inclusion: non_null
  # Outbound HTTP timeouts. Verify they apply to the RestClient used by Spring AI.
  http:
    client:
      connect-timeout: 10s
      read-timeout: 120s
  # SPRING AI
  ai:
    chat:
      client:
        enabled: true
    openai:
      api-key: ${CHAT_KEY}
      base-url: ${CHAT_BASE_URL}
      chat:
        options:
          model: ${CHAT_MODEL}
          temperature: 0.2
          max-completion-tokens: 2048
# APPLICATION
praya:
  portfolio:
    url: ${PORTFOLIO_URL}
  github:
    username: ${GITHUB_USERNAME}
    api-url: ${GITHUB_API_URL}
  linkedin:
    url: ${LINKEDIN_URL}
  cors:
    path-pattern: "/api/**"
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods:
      - GET
      - POST
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Authorization
      - Accept
      - X-Requested-With
      - X-API-Version
    exposed-headers:
      - Content-Type
      - Cache-Control
      - Connection
      - X-API-Version
    allow-credentials: true
    max-age: 3600
  # Throttling
  rate-limiter:
    api-delay-ms: 50
  ratelimit:
    enabled: true
  # AI GUARDRAILS
  ai:
    guardrail:
      enabled: true
      strict-mode: true
      max-input-length: 1000
      input-violation-message: "Input security validation failed: Request violates safety policies."
      output-violation-message: "Output security validation failed: Response withheld due to safety policies."
      blocked-words:
        - .env
        - .env file
        - env file
        - env
        - printenv
        - system prompt
        - drop table
        - ignore previous instructions
        - bypass restrictions
      input-patterns:
        # Prompt injection / jailbreak
        - "ignore\\s+(all\\s+)?(the\\s+)?previous\\s+(instructions|prompts|rules)"
        - "disregard\\s+(all\\s+)?(prior|previous)\\s+(instructions|rules)"
        - "you\\s+are\\s+now\\s+in\\s+(dan|developer|jailbreak|unrestricted)\\s+mode"
        - "(pretend|act|behave)\\s+(to\\s+be|as|like)\\s+(an?\\s+)?(unrestricted|jailbroken|different|evil|admin)"
        - "(decode|base64|rot13).{0,40}(and\\s+)?(follow|execute|run|obey)"
        # System prompt / rules extraction
        - "(reveal|show|tell|print|dump|output|repeat|display|leak).{0,30}(system\\s+prompt|developer\\s+instructions?|system\\s+rules?|internal\\s+instructions?|system\\s+directive|hidden\\s+rules?)"
        - "what\\s+(are|is)\\s+your\\s+(rules|instructions|prompts?|guidelines|constraints|directives)"
        - "repeat\\s+(everything|the\\s+text)\\s+(above|prior)"
        # Secrets / infrastructure probing
        - "(provide|show|give|tell|print|share|what|reveal|leak|dump|cat|read|get|display|view|export|output).{0,30}(\\.env(\\b|[\\s._-]*(file|local|prod|dev))?|\\b(the\\s+)?env\\b([\\s._-]*(file|vars?|variables?))?|\\b(api[_-]?keys?|passwords?|secrets?|access[_-]?tokens?|credentials?|connection[_-]?strings?|application\\.ya?ml|environment[_-]?variables?))"
        - "^\\s*(\\.?env|printenv|getenv|setenv)\\s*$"
        - "(^|\\s)(cat|type|more|less|head|tail|vi|vim|nano)\\s+(\\S*\\/)?\\.env\\b"
        - "(list|show|what).{0,20}(tools|functions|plugins).{0,20}(you\\s+have|available|can\\s+call)"
      output-patterns:
        - "(api[_-]?key|access[_-]?token|secret[_-]?key)\\s*[:=]\\s*['\"]?[a-zA-Z0-9_\\-]{16,}['\"]?"
        - "\\bey[A-Za-z0-9_-]{10,}\\.ey[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
        - "jdbc:[a-zA-Z0-9]+://\\S*password="
        - "-----BEGIN\\s+(RSA\\s+|EC\\s+|OPENSSH\\s+)?PRIVATE\\s+KEY-----"
        - "\\bAKIA[0-9A-Z]{16}\\b"
        - "\\bsk-[A-Za-z0-9_-]{20,}"
        - "\\b(10\\.\\d{1,3}|192\\.168|172\\.(1[6-9]|2\\d|3[01]))\\.\\d{1,3}\\.\\d{1,3}\\b"
        - "(strict\\s+anti-hallucination|two-tier\\s+progressive\\s+tool\\s+catalog|progressive\\s+disclosure\\s+rules|system\\s+prompt\\s*:|internal\\s+rules\\s*:|tool\\s+calling\\s+chat\\s+options|under\\s+no\\s+circumstances\\s+should\\s+you\\s+reveal)"
      scope:
        enabled: true
        require-topic-keyword: true
        follow-up-max-words: 6
        message: "I can help with questions about my career, skills, projects, blogs, certifications and how to contact me."
        allowed-topics:
          - "career, experience, work, job, role, resume, cv, hire, hiring, available"
          - "skill, tech stack, technolog, java, spring, react, docker, kubernetes, aws, sql, microservice, llm, genai"
          - "project, blog, article, certif, course, education, degree"
          - "contact, email, linkedin, github, portfolio"
        smalltalk-patterns:
          - "^(hi+|hello|hey|namaste|good\\s+(morning|afternoon|evening))\\b[\\s!.,?]*$"
          - "^(thanks|thank\\s+you|ok|okay|great|cool|nice|bye|goodbye)\\b[\\s!.,?]*$"
          - "^(who|what)\\s+are\\s+you\\??$"
          - "^what\\s+can\\s+you\\s+(do|help\\s+with)\\??$"
        off-topic-patterns:
          - "\\b(write|generate|compose|draft)\\b.{0,40}\\b(poem|story|essay|joke|song|homework|assignment|malware|exploit)\\b"
          - "\\b(weather|stock\\s+price|bitcoin|lottery|horoscope|recipe|cricket\\s+score|election)\\b"
          - "\\b(medical\\s+advice|diagnos\\w*|legal\\s+advice|prescription)\\b"
          - "\\b(solve|calculate)\\b.{0,40}\\b(equation|integral|math\\w*)\\b"
# LOGGING
logging:
  file:
    name: ${LOG_PATH:logs/praya-agent.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.pranit.praya: ${LOG_LEVEL:INFO}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:logs/praya-agent.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
# ACTUATOR AND HEALTH CHECKS
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
# APPLICATION INFORMATION
info:
  app:
    name: Praya-Agent
    description: "Praya AI - Pranit's Personal AI Assistant"